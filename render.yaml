services:
  # Backend Service
  - type: web
    name: polyedu-backend
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: polyedu-db
          property: connectionString
      - key: N8N_WEBHOOK_URL
        value: https://polyedu-n8n.onrender.com/webhook/polyedu-ai
      - key: JWT_SECRET
        generateValue: true

  # n8n Service
  - type: web
    name: polyedu-n8n
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: n8n.Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: "admin"
      - key: N8N_BASIC_AUTH_PASSWORD
        value: "password123"
      - key: N8N_HOST
        value: polyedu-n8n.onrender.com
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: https://polyedu-n8n.onrender.com/
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: polyedu-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: polyedu-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: polyedu-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: polyedu-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: polyedu-db
          property: password

databases:
  # PostgreSQL Database
  - name: polyedu-db
    region: frankfurt
    plan: free
    databaseName: polyedu
    user: polyedu_user
